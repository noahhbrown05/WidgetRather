<title>Widget Rather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ==================================================================
   Widget Rather — clickable MVP mockup
   Reproduced from design/mockups/ (Noah, 2026-09-10), pixel-for-pixel
   as far as HTML allows.

   What the mockups actually establish, and what this follows:
     · pink = "Read minds" / option A · blue = "See the future" / B
       The colour codes the OPTION, not the selection.
     · pill labels are near-black plum, never white
     · picked = magenta disc + white check, on the same pink pill
     · app background is a lavender→pink→blue wash, not white
     · each result row is its own white card: label | track | %
     · one rounded geometric family throughout (Nunito)

   Two token sets on purpose: --app-* is the phone interior and is
   FIXED light, because it is a picture of a light-themed iOS app.
   Everything else follows the viewer's theme.
   ================================================================== */

:root{
  /* ---------- the app's palette, sampled from the mockups ---------- */
  --plum:#1C1030;          /* wordmark + all label text */
  --plum-2:#3B2E52;
  --plum-3:#6B5F82;

  --pink-1:#F9C2E6;        /* option pill, light end */
  --pink-2:#F09BD2;        /* option pill, deep end */
  --pink-3:#EC85C8;
  --magenta:#D6299B;       /* the check disc */
  --bar-pink-1:#F58ACB;
  --bar-pink-2:#EB6DB8;

  --blue-1:#D5E4FB;        /* option pill, light end */
  --blue-2:#BBD2F5;
  --bar-blue-1:#93B8F0;
  --bar-blue-2:#7BA3E8;

  --card:#FCFAFE;
  --track:#EDE7F7;
  --lav-chip:#EDE6F8;
  --divider:#E4DCF2;

  /* ---------- harness, theme-aware ---------- */
  --ground:#F4F1FA;
  --surface:#FFFFFF;
  --surface-2:#F8F5FD;
  --hairline:#E5DEF2;
  --ink:#1C1030;
  --ink-muted:#6B5F82;
  --ink-faint:#A79FBD;
  --accent:#C04B9E;
  --accent-soft:#FBE6F4;
  --warn:#A8701C;

  --shadow-phone:0 40px 80px -22px rgba(28,16,48,.4), 0 0 0 1px rgba(28,16,48,.05);

  --f:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#15101F;
    --surface:#1F1830;
    --surface-2:#281F3B;
    --hairline:#382D4E;
    --ink:#F0EAF8;
    --ink-muted:#A79FBD;
    --ink-faint:#766B8F;
    --accent:#EE8FCE;
    --accent-soft:#3A2140;
    --warn:#D5A44F;
    --shadow-phone:0 40px 80px -22px rgba(0,0,0,.78), 0 0 0 1px rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  --ground:#15101F;
  --surface:#1F1830;
  --surface-2:#281F3B;
  --hairline:#382D4E;
  --ink:#F0EAF8;
  --ink-muted:#A79FBD;
  --ink-faint:#766B8F;
  --accent:#EE8FCE;
  --accent-soft:#3A2140;
  --warn:#D5A44F;
  --shadow-phone:0 40px 80px -22px rgba(0,0,0,.78), 0 0 0 1px rgba(255,255,255,.07);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---------------- masthead ---------------- */
.masthead{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
  padding:18px 28px 15px;border-bottom:1px solid var(--hairline);
}
.wordmark{
  font-family:var(--f);font-weight:900;font-size:25px;
  letter-spacing:-.03em;margin:0;line-height:1.05;
}
.masthead .sub{color:var(--ink-muted);font-size:13px;margin:2px 0 0;font-weight:500}
.badges{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.flag{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:4px 11px;
}
.toggle{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-muted);background:var(--surface-2);
  border:1px solid var(--hairline);border-radius:999px;padding:5px 12px 5px 9px;
}
.toggle:hover{color:var(--ink)}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.switch{width:28px;height:16px;border-radius:999px;background:var(--hairline);position:relative;transition:background .16s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle[aria-pressed="true"] .switch{background:var(--accent)}
.toggle[aria-pressed="true"] .switch::after{transform:translateX(12px)}

/* ---------------- workbench ---------------- */
.workbench{display:grid;grid-template-columns:214px minmax(0,1fr) 306px;align-items:start;min-height:calc(100vh - 76px)}
.rail{padding:20px 15px 40px;border-right:1px solid var(--hairline);position:sticky;top:0}
.rail-group{margin-bottom:18px}
.rail-label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 7px 10px}
.rail-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav{
  width:100%;text-align:left;cursor:pointer;font-family:var(--f);
  font-size:13.5px;font-weight:600;color:var(--ink-muted);
  background:none;border:0;padding:8px 11px;border-radius:9px;
  display:flex;align-items:center;gap:9px;transition:background .14s,color .14s;
}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--accent);color:#fff;font-weight:700}
.nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .tick{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.4;flex:none}
.nav[aria-current="true"] .tick{opacity:1}

.stage{display:flex;flex-direction:column;align-items:center;padding:30px 24px 56px;gap:15px}
.stage-hint{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.02em;text-align:center;max-width:48ch;line-height:1.6}

/* ---------------- phone ---------------- */
.phone{width:348px;height:714px;flex:none;border-radius:52px;background:#1A1A1F;padding:10px;box-shadow:var(--shadow-phone);position:relative}
.screen{width:100%;height:100%;border-radius:43px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:100px;height:29px;border-radius:999px;background:#0A0A10;z-index:9}
.statusbar{
  height:47px;flex:none;z-index:8;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 24px 6px;color:var(--plum);font-weight:800;font-size:13px;position:relative;
}
.sigs{display:flex;align-items:center;gap:4px}
.sigs .b{display:flex;gap:1.6px;align-items:flex-end}
.sigs .b i{width:2.6px;background:currentColor;border-radius:.8px;display:block}
.sigs .b i:nth-child(1){height:3.5px}.sigs .b i:nth-child(2){height:5.5px}
.sigs .b i:nth-child(3){height:7.5px}.sigs .b i:nth-child(4){height:9.5px}
.sigs .bat{width:17px;height:9px;border-radius:2.5px;background:currentColor}

.view{display:none;flex:1;min-height:0;flex-direction:column}
.view[data-active="true"]{display:flex}

/* ---------------- home screen ---------------- */
.home{position:relative;color:var(--plum)}
.home::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(80% 52% at 8% 2%,   #F6D9EE 0%, transparent 62%),
    radial-gradient(74% 48% at 98% 12%, #CFE0FA 0%, transparent 60%),
    radial-gradient(90% 46% at 88% 58%, #AFC9F4 0%, transparent 64%),
    radial-gradient(96% 46% at 10% 74%, #E2BCEC 0%, transparent 66%),
    radial-gradient(84% 40% at 62% 98%, #C9B4EC 0%, transparent 66%),
    linear-gradient(163deg,#F3E2F8 0%,#E6DDF8 44%,#D3E0F7 100%);
}
.home::after{
  content:"";position:absolute;left:-12%;right:-12%;bottom:16%;height:34%;z-index:0;
  background:linear-gradient(178deg,rgba(222,200,238,.62),rgba(186,208,244,.36));
  border-radius:56% 44% 52% 48% / 74% 68% 32% 26%;
  filter:blur(9px);
}
.home-inner{flex:1;display:flex;flex-direction:column;padding:2px 17px 0;gap:9px;min-height:0;position:relative;z-index:2}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px 12px}
.slot2{grid-column:span 2;grid-row:span 2}
.app{display:flex;flex-direction:column;align-items:center;gap:4px}
.app .ic{
  width:100%;aspect-ratio:1;border-radius:14px;
  box-shadow:0 2px 5px rgba(40,30,60,.16);
  display:grid;place-items:center;overflow:hidden;
}
.app .nm{font-size:9.5px;font-weight:600;color:var(--plum-2);letter-spacing:-.01em}
.ic svg{width:66%;height:66%}

.dock{
  margin:auto 0 12px;padding:10px 12px;border-radius:28px;
  background:rgba(255,255,255,.42);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative;z-index:2;
}
.dock .ic{border-radius:14px}
.hi{width:112px;height:5px;border-radius:3px;background:rgba(40,28,62,.42);margin:0 auto 8px;flex:none;position:relative;z-index:2}
.wname{font-size:9.5px;font-weight:600;color:var(--plum-2);text-align:center;margin:4px 0 0;text-shadow:0 1px 2px rgba(255,255,255,.6)}

/* ---------------- the widget ---------------- */
.widget{
  background:linear-gradient(158deg,rgba(255,255,255,.88) 0%,rgba(250,238,250,.82) 52%,rgba(240,238,252,.82) 100%);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:24px;padding:12px 13px;
  box-shadow:0 7px 20px rgba(46,32,68,.16), inset 0 0 0 1px rgba(255,255,255,.72);
  display:flex;flex-direction:column;color:var(--plum);
}
.w-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.w-mark{font-weight:900;letter-spacing:-.032em;font-size:15px;line-height:1.1}
.w-plus{
  width:22px;height:22px;border-radius:50%;flex:none;background:var(--lav-chip);
  display:grid;place-items:center;color:var(--plum-2);font-weight:700;font-size:14px;line-height:1;
}
.w-ask{font-size:11.5px;font-weight:600;color:var(--plum-2);margin:1px 0 0}

/* option pill — pink = A, blue = B. label always plum. */
.pill{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 13px;border-radius:14px;border:0;cursor:pointer;
  font-family:var(--f);font-weight:800;font-size:13.5px;color:var(--plum);
  text-align:left;line-height:1.2;letter-spacing:-.01em;
  transition:transform .13s ease,filter .13s ease;
}
.pill:hover{transform:translateY(-1px);filter:brightness(1.03)}
.pill:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.pill.a{background:linear-gradient(96deg,var(--pink-1),var(--pink-2))}
.pill.b{background:linear-gradient(96deg,var(--blue-1),var(--blue-2))}
.pill .gl{flex:none;width:19px;height:19px;color:var(--plum)}
.pill .gl svg{width:100%;height:100%}
.check{
  width:21px;height:21px;border-radius:50%;flex:none;background:var(--magenta);
  display:grid;place-items:center;box-shadow:0 1px 4px rgba(214,41,155,.4);
}
.check svg{width:12px;height:12px;color:#fff}
.pill.lg{padding:11px 15px;font-size:15px;border-radius:16px}
.pill.lg .gl,.pill.lg .check{width:23px;height:23px}
.pill.sm{padding:6px 9px;font-size:10px;border-radius:10px;gap:6px}
.pill.sm .gl{width:13px;height:13px}

.w-opts{display:flex;flex-direction:column;gap:7px;margin-top:9px}

/* result rows inside a widget: label + % on one line, bar under */
.wrow{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.wrow .top{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--plum-2)}
.wrow .top b{color:var(--plum);font-weight:800;font-variant-numeric:tabular-nums}
.tr{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.fl{height:100%;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.fl.pk{background:linear-gradient(90deg,var(--bar-pink-1),var(--bar-pink-2))}
.fl.bl{background:linear-gradient(90deg,var(--bar-blue-1),var(--bar-blue-2))}

/* inline result row: label | track | %   (large widget + in-app) */
.irow{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;color:var(--plum-2)}
.irow .lb{flex:none}
.irow .tr{flex:1}
.irow .pc{flex:none;color:var(--plum);font-weight:800;font-variant-numeric:tabular-nums}

.only-ev{display:flex}
body[data-ev="off"] .only-ev{display:none!important}

.faces{display:flex;align-items:center;gap:7px}
.stack{display:flex}
.stack .av{width:22px;height:22px;border-radius:50%;margin-left:-6px;border:2px solid rgba(255,255,255,.9);overflow:hidden;flex:none}
.stack .av:first-child{margin-left:0}
.av svg{width:100%;height:100%;display:block}

/* ---------------- in-app ---------------- */
.appview{position:relative;color:var(--plum)}
.appview::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(88% 40% at 6% 0%,   #FAE3F4 0%, transparent 66%),
    radial-gradient(80% 40% at 100% 26%,#E4E6FB 0%, transparent 62%),
    radial-gradient(90% 40% at 88% 96%, #DCE7F9 0%, transparent 64%),
    linear-gradient(170deg,#F8EDFA 0%,#F2ECFA 52%,#EBEDFA 100%);
}
.appview > *{position:relative;z-index:2}
.ahead{display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px;flex:none}
.amark{font-weight:900;font-size:24px;letter-spacing:-.034em;line-height:1}
.aplus{
  width:31px;height:31px;border-radius:50%;border:0;cursor:pointer;background:var(--lav-chip);
  color:var(--plum-2);font-size:18px;font-weight:600;line-height:1;display:grid;place-items:center;
}
.abody{flex:1;min-height:0;overflow-y:auto;padding:0 20px 16px;display:flex;flex-direction:column;gap:13px}

/* the hero question card */
.qcard{
  border-radius:22px;padding:14px 15px 15px;
  background:linear-gradient(168deg,rgba(255,255,255,.9),rgba(252,244,252,.78));
  box-shadow:0 3px 14px rgba(60,40,84,.07), inset 0 0 0 1px rgba(255,255,255,.8);
  display:flex;flex-direction:column;gap:9px;position:relative;
}
.qask{font-size:15px;font-weight:700;color:var(--plum);text-align:center;margin:0}
.qagree{font-size:12px;font-weight:700;color:var(--plum-2);text-align:center;margin:0}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;width:8px;height:2.4px;border-radius:2px;background:var(--pink-2);display:block}

.shead{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:-.025em}
.shead .gi{width:19px;height:19px;flex:none;color:var(--plum)}
.shead .gi svg{width:100%;height:100%}
.shead .stack{margin-left:auto}
.shead .stack .av{width:25px;height:25px;margin-left:-7px;border-color:rgba(255,255,255,.95)}
.plus8{
  min-width:27px;height:27px;padding:0 6px;border-radius:999px;background:var(--lav-chip);
  display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--plum-2);margin-left:4px;flex:none;
}

/* each result row is its own white card */
.rcard{
  display:flex;align-items:center;gap:11px;
  background:rgba(255,255,255,.78);border-radius:15px;padding:9px 13px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);
  font-size:12.5px;font-weight:600;color:var(--plum-2);
}
.rcard .lb{flex:none;width:84px}
.rcard .tr{flex:1;height:11px}
.rcard .pc{flex:none;width:34px;text-align:right;font-weight:800;color:var(--plum);font-variant-numeric:tabular-nums}
.rstack{display:flex;flex-direction:column;gap:7px}
.hr{height:1px;background:var(--divider);margin:3px 0}

.tabbar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 0 4px;background:rgba(255,255,255,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.75)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;padding:2px 0;font-family:var(--f);font-size:10px;font-weight:700;color:var(--plum-3)}
.tab svg{width:21px;height:21px}
.tab[aria-current="true"]{color:var(--magenta)}
.tab:focus-visible{outline:2px solid var(--magenta);outline-offset:-2px;border-radius:7px}

.btn{font-family:var(--f);font-weight:800;font-size:15px;padding:14px 18px;border-radius:16px;border:0;cursor:pointer;width:100%;transition:filter .13s,transform .13s;color:var(--plum)}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.btn-dark{background:var(--plum);color:#fff}
.btn-pink{background:linear-gradient(96deg,var(--pink-1),var(--pink-2))}
.btn-ghost{background:rgba(255,255,255,.72)}

.field{border-radius:15px;padding:10px 13px;background:rgba(255,255,255,.74);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);display:flex;flex-direction:column;gap:1px}
.field label{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--plum-3)}
.field .val{font-weight:800;font-size:17px}
.code{font-family:var(--f-mono);font-weight:500;font-size:23px;letter-spacing:.15em;color:var(--magenta)}
.eyebrow{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--plum-3);margin:0}
.ah{font-weight:900;font-size:25px;line-height:1.13;letter-spacing:-.032em;margin:0;text-wrap:balance}
.ap{margin:0;color:var(--plum-2);font-size:13px;line-height:1.55;font-weight:600}
.appicon{
  width:80px;height:80px;border-radius:22px;align-self:center;position:relative;
  background:linear-gradient(150deg,#FBDCF0 0%,#F3BFE4 100%);
  display:grid;place-items:center;color:var(--plum);
  font-weight:900;font-size:31px;letter-spacing:-.06em;
  box-shadow:0 10px 24px rgba(240,155,210,.45);
}
.rows{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.74)}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--divider);font-size:13.5px;font-weight:700;cursor:pointer;color:var(--plum)}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.95)}
.row .chev{margin-left:auto;color:var(--plum-3);font-weight:600}
.row.danger{color:#C42F5E}

/* ---------------- notes rail ---------------- */
.notes{padding:20px 22px 48px;border-left:1px solid var(--hairline);position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
.ntitle{font-weight:900;font-size:17px;letter-spacing:-.028em;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--f-mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--hairline)}
.chip.hi{background:var(--accent-soft);color:#8E2F72;border-color:rgba(192,75,158,.28);font-weight:500}
:root[data-theme="dark"] .chip.hi{color:#F4B9DE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.hi{color:#F4B9DE}}
.nbody{font-size:12.5px;line-height:1.62;color:var(--ink-muted);margin:0;font-weight:500}
.nbody strong{color:var(--ink);font-weight:800}
.cons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.con{font-size:12px;line-height:1.5;color:var(--ink-muted);padding-left:11px;border-left:2px solid var(--hairline);font-weight:500}
.con b{color:var(--ink);font-weight:800}
.con .src{display:block;margin-top:3px;font-family:var(--f-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.01em}
.con.open{border-left-color:var(--warn)}
.con.open b{color:var(--warn)}
.nfoot{margin-top:auto;padding-top:13px;border-top:1px solid var(--hairline);font-family:var(--f-mono);font-size:9.5px;line-height:1.7;color:var(--ink-faint)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  var o='';for(var i=0;i<n;i++){o+='<span class="av">'+face(i)+'</span>';}
  return '<span class="stack">'+o+'</span>';

function optA(cls,picked){
  return '<button class="pill a '+(cls||'')+'" data-answer="a">'+

}
function optB(cls){
  return '<button class="pill b '+(cls||'')+'" data-answer="b"><span class="gl">'+I.ball+'</span>See the future</button>';
}
function wRow(lab,pct,kind){
  return '<div class="wrow'+(lab==='Everyone'?' only-ev':'')+'"><div class="top"><span>'+lab+'</span><b>'+pct+'%</b></div>'+
    '<div class="tr"><div class="fl '+kind+'" style="width:'+pct+'%"></div></div></div>';
}
function iRow(lab,pct,kind){
  return '<div class="irow'+(lab==='Everyone'?' only-ev':'')+'"><span class="lb">'+lab+'</span>'+
    '<span class="tr"><span class="fl '+kind+'" style="width:'+pct+'%"></span></span><span class="pc">'+pct+'%</span></div>';
}

/* ================= wiring ================= */
function show(v){
  if(!SCREENS[v]) return;
  document.getElementById('screen').innerHTML='<div class="notch"></div>'+SCREENS[v]();
  document.querySelectorAll('.nav').forEach(function(b){
    b.setAttribute('aria-current', b.getAttribute('data-go')===v?'true':'false');
  });
  var n=NOTES[v];
  document.getElementById('n-t').innerHTML=n.t;
  document.getElementById('n-m').innerHTML=n.m.map(function(c){return '<span class="chip'+(c[1]?' '+c[1]:'')+'">'+c[0]+'</span>';}).join('');
  document.getElementById('n-b').innerHTML=n.b;
  document.getElementById('n-c').innerHTML=n.c.map(function(c){return '<li class="con'+(c[2]?' open':'')+'">'+c[0]+'<span class="src">'+c[1]+'</span></li>';}).join('');
  document.getElementById('hint').innerHTML=HINTS[v]||'';
}

document.addEventListener('click',function(e){
  var t=e.target.closest('#ev');
  if(t){
    var on=t.getAttribute('aria-pressed')==='true';
    t.setAttribute('aria-pressed',on?'false':'true');
    document.body.setAttribute('data-ev',on?'off':'on');
    return;
  }
  var go=e.target.closest('[data-go]');
  if(go){ show(go.getAttribute('data-go')); return; }
  var a=e.target.closest('[data-answer]');
  if(a){ show(a.closest('.home')?'after':'voted'); }
});

document.body.setAttribute('data-ev','on');
show('before');
</script>
